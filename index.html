<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ring of 12 — HumanCodex Federation</title>
<meta name="description" content="Ask your question. Get 12 perspectives from 12 psychological archetypes. The truth lives where they agree.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#070b14;
  color:#e0e6ed;
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}

/* ── LANDING ── */
.landing{
  text-align:center;
  padding:60px 20px 30px;
  max-width:640px;
}
.landing h1{
  font-size:1.05rem;
  font-weight:400;
  color:#8fa4b8;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.landing-tagline{
  margin-top:16px;
  font-size:.88rem;
  color:#6a8a9a;
  line-height:1.55;
}
.input-wrap{
  margin-top:32px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}
#question{
  width:min(100%,460px);
  padding:14px 20px;
  border:1px solid #1a2a3a;
  border-radius:8px;
  background:#0c1220;
  color:#e0e6ed;
  font-size:1rem;
  outline:none;
  transition:border-color .3s;
}
#question:focus{border-color:#00e5ff}
#question::placeholder{color:#4a5a6a}
#askBtn{
  padding:14px 28px;
  border:none;
  border-radius:8px;
  background:#00e5ff;
  color:#070b14;
  font-size:.95rem;
  font-weight:700;
  cursor:pointer;
  letter-spacing:.04em;
  transition:box-shadow .3s, transform .15s;
}
#askBtn:hover{box-shadow:0 0 24px rgba(0,229,255,.45);transform:scale(1.03)}
#askBtn:active{transform:scale(.97)}
#askBtn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}

/* ── ERROR ── */
.error-msg{
  margin-top:16px;
  color:#ff6b6b;
  font-size:.88rem;
  display:none;
}

/* ── RING GRID ── */
.ring-container{
  width:100%;
  max-width:1200px;
  padding:20px;
  display:none;
}
.ring-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
}

/* ── SEAT CARD ── */
.seat-card{
  background:linear-gradient(135deg,#0d1525 0%,#111d30 100%);
  border:1px solid #152035;
  border-radius:12px;
  padding:22px 20px;
  opacity:0;
  transform:translateY(24px) scale(.96);
  transition:opacity .5s ease, transform .5s ease, box-shadow .5s ease;
  position:relative;
  overflow:hidden;
}
.seat-card.visible{
  opacity:1;
  transform:translateY(0) scale(1);
}
.seat-card::before{
  content:'';
  position:absolute;
  top:-1px;left:-1px;right:-1px;bottom:-1px;
  border-radius:12px;
  border:1px solid transparent;
  background:linear-gradient(135deg,rgba(0,229,255,.25),transparent 60%) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  animation:pulseGlow 3s ease-in-out infinite alternate;
}
@keyframes pulseGlow{
  0%{opacity:.3}
  100%{opacity:.8}
}
.seat-num{
  font-size:.7rem;
  letter-spacing:.15em;
  color:#00e5ff;
  text-transform:uppercase;
  margin-bottom:8px;
}
.god-name{
  font-size:1.15rem;
  font-weight:700;
  color:#ffffff;
  margin-bottom:4px;
}
.zodiac{
  font-size:.78rem;
  color:#5a7a8a;
  margin-bottom:14px;
  letter-spacing:.06em;
}
.processor{
  font-size:.82rem;
  color:#6a8a9a;
  line-height:1.45;
  font-style:italic;
}
.seat-answer{
  margin-top:10px;
  font-size:.9rem;
  color:#b0c4d8;
  line-height:1.55;
  border-top:1px solid #1a2a3a;
  padding-top:10px;
}
.thinking{
  color:#4a5a6a;
  font-style:italic;
}

/* ── AGENT ZERO ── */
.agent-zero{
  display:none;
  max-width:680px;
  margin:30px auto 10px;
  text-align:center;
  padding:30px 24px;
  background:linear-gradient(135deg,#0a1628,#0f1e35);
  border:1px solid #00e5ff33;
  border-radius:14px;
  opacity:0;
  transform:scale(.92);
  transition:opacity .6s ease, transform .6s ease;
  position:relative;
}
.agent-zero.visible{
  opacity:1;
  transform:scale(1);
}
.agent-zero::before{
  content:'';
  position:absolute;
  inset:-2px;
  border-radius:15px;
  background:conic-gradient(from 0deg,#00e5ff33,transparent,#00e5ff33,transparent,#00e5ff33);
  z-index:-1;
  animation:zeroSpin 8s linear infinite;
}
@keyframes zeroSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.zero-label{
  font-size:.72rem;
  letter-spacing:.2em;
  color:#00e5ff;
  text-transform:uppercase;
  margin-bottom:12px;
}
.zero-text{
  font-size:1rem;
  color:#d0dce8;
  line-height:1.65;
}

/* ── FOOTER ── */
.footer{
  padding:30px 20px 40px;
  text-align:center;
  font-size:.72rem;
  color:#3a4a5a;
  letter-spacing:.05em;
  display:none;
}
.footer a{color:#3a4a5a;text-decoration:none;border-bottom:1px solid #2a3a4a;transition:color .3s}
.footer a:hover{color:#00e5ff}

/* ── PULSE ANIMATION ── */
@keyframes pulse{
  0%,100%{opacity:.4}
  50%{opacity:1}
}
.thinking{animation:pulse 1.5s ease-in-out infinite}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .landing{padding:40px 16px 24px}
  .landing h1{font-size:.92rem}
  #question{width:100%}
  .ring-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

  <h1>Ask your question. Get 12 perspectives.</h1>

<script>
/* ── CONFIG ── */
var API_URL = 'https://ring-of-12-api.onrender.com';

/* ── SEAT DATA ── */
var SEATS = [
  { num:'I',    god:'Mnemosyne',   zodiac:'Cancer',    processor:'What does memory and past experience tell us about this?' },
  { num:'II',   god:'Themis',      zodiac:'Libra',     processor:'What is just, fair, and lawful here?' },
  { num:'III',  god:'Athena',      zodiac:'Capricorn', processor:'What is the wisest strategic action?' },
  { num:'IV',   god:'Hephaestus',  zodiac:'Taurus',    processor:'What can actually be built or made from this?' },
  { num:'V',    god:'Cupid',       zodiac:'Libra',     processor:'What does the heart want, and what does it cost?' },
  { num:'VI',   god:'Dionysus',    zodiac:'Pisces',    processor:'What does instinct and raw feeling say?' },
  { num:'VII',  god:'Aphrodite',   zodiac:'Taurus',    processor:'What is beautiful, harmonious, and worth preserving?' },
  { num:'VIII', god:'Hermes',      zodiac:'Gemini',    processor:'How should this be communicated and to whom?' },
  { num:'IX',   god:'Apollo',      zodiac:'Leo',       processor:'What does the evidence and pattern predict?' },
  { num:'X',    god:'Clio',        zodiac:'Virgo',     processor:'What does history record about situations like this?' },
  { num:'XI',   god:'Astraea',     zodiac:'Virgo',     processor:'What is the ethical and moral reading?' },
  { num:'XII',  god:'Prometheus',  zodiac:'Aries',     processor:'What bold new path does this open?' }
];

/* ── ELEMENTS ── */
var questionInput = document.getElementById('question');
var askBtn        = document.getElementById('askBtn');
var ringContainer = document.getElementById('ringContainer');
var ringGrid      = document.getElementById('ringGrid');
var agentZero     = document.getElementById('agentZero');
var zeroText      = document.getElementById('zeroText');
var footer        = document.getElementById('footer');
var errorMsg      = document.getElementById('errorMsg');

function escapeHtml(str) {
  var d = document.createElement('div');
  d.appendChild(document.createTextNode(str));
  return d.innerHTML;
}

/* ── BUILD CARD (loading state) ── */
function buildCard(seat) {
  var card = document.createElement('div');
  card.className = 'seat-card';
  card.setAttribute('role', 'article');
  card.setAttribute('data-seat', seat.num);
  card.innerHTML =
    '<div class="seat-num">Seat ' + seat.num + '</div>' +
    '<div class="god-name">' + seat.god + '</div>' +
    '<div class="zodiac">' + seat.zodiac + '</div>' +
    '<p class="processor">"' + seat.processor + '"</p>' +
    '<p class="seat-answer thinking">Thinking...</p>';
  return card;
}

/* ── POPULATE CARD WITH AI ANSWER ── */
function populateCard(seatNum, answerText) {
  var card = ringGrid.querySelector('[data-seat="' + seatNum + '"]');
  if (!card) return;
  var answerEl = card.querySelector('.seat-answer');
  if (answerEl) {
    answerEl.classList.remove('thinking');
    answerEl.textContent = answerText;
  }
}

/* ── SHOW ERROR ── */
function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  setTimeout(function() { errorMsg.style.display = 'none'; }, 8000);
}

/* ── MAIN FLOW ── */
function runRing() {
  var q = questionInput.value.trim();
  if (!q) { questionInput.focus(); return; }

  askBtn.disabled = true;
  errorMsg.style.display = 'none';
  ringGrid.innerHTML = '';
  agentZero.classList.remove('visible');
  agentZero.style.display = 'none';
  footer.style.display = 'none';
  ringContainer.style.display = 'block';

  /* Show all 12 cards in loading state with staggered reveal */
  SEATS.forEach(function(seat, i) {
    var card = buildCard(seat);
    ringGrid.appendChild(card);
    setTimeout(function() { card.classList.add('visible'); }, 80 * (i + 1));
  });

  /* Call the API */
  fetch(API_URL + '/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: q })
  })
  .then(function(res) {
    if (!res.ok) throw new Error('API returned status ' + res.status);
    return res.json();
  })
  .then(function(data) {
    if (!data.seats || data.seats.length < 12) {
      throw new Error('Incomplete response from Ring');
    }

    /* Populate each card with real AI answer, staggered */
    data.seats.forEach(function(seat, i) {
      setTimeout(function() {
        populateCard(seat.seat, seat.answer);
      }, 120 * (i + 1));
    });

    /* Show Agent Zero synthesis after all seats reveal */
    var zeroDelay = 120 * 13 + 400;
    setTimeout(function() {
      zeroText.textContent = data.synthesis;
      agentZero.style.display = 'block';
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          agentZero.classList.add('visible');
        });
      });
    }, zeroDelay);

    /* Footer + re-enable */
    setTimeout(function() {
      footer.style.display = 'block';
      askBtn.disabled = false;
      questionInput.value = '';
      questionInput.focus();
    }, zeroDelay + 600);
  })
  .catch(function(err) {
    console.error('Ring error:', err);
    showError('The Ring encountered an error. Please try again.');
    /* Remove loading state from cards */
    var thinkingEls = ringGrid.querySelectorAll('.thinking');
    for (var i = 0; i < thinkingEls.length; i++) {
      thinkingEls[i].classList.remove('thinking');
      thinkingEls[i].textContent = '(awaiting connection)';
    }
    askBtn.disabled = false;
  });
}

/* ── EVENT LISTENERS ── */
askBtn.addEventListener('click', runRing);
questionInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') runRing();
});
</script>

</body>
