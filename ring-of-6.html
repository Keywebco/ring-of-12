<style>

  body{margin:0;background:#0a0a0a;color:#e8e8e8;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:19px;line-height:1.7;min-height:100vh;overflow-x:hidden}

  a:hover{color:#ffffff}
  a:focus-visible,.btn:focus-visible,button:focus-visible{outline:3px solid #ffffff;outline-offset:3px;border-radius:6px}
  .skip{position:absolute;left:-9999px;top:0;background:#ffffff;color:#000000;padding:12px 18px;font-weight:700;z-index:10}
  .skip:focus{left:12px;top:12px}
  .sky,.mesh,.glow{position:fixed;inset:0;pointer-events:none;z-index:-3}
  .sky{background-image:radial-gradient(1.5px 1.5px at 10% 20%,#ffffffcc,transparent 60%),radial-gradient(1px 1px at 30% 70%,#ffffffaa,transparent 60%),radial-gradient(2px 2px at 55% 35%,rgba(var(--rgb),.9),transparent 60%),radial-gradient(1px 1px at 75% 80%,#ffffff99,transparent 60%),radial-gradient(1.5px 1.5px at 90% 15%,#ffffffbb,transparent 60%),radial-gradient(1px 1px at 45% 90%,#ffffff88,transparent 60%);background-size:420px 420px;animation:drift 140s linear infinite;opacity:.8}
  .mesh{z-index:-2;background-image:repeating-linear-gradient(60deg,rgba(var(--rgb),.07) 0 1px,transparent 1px 90px),repeating-linear-gradient(-60deg,rgba(var(--rgb),.07) 0 1px,transparent 1px 90px),repeating-linear-gradient(0deg,rgba(var(--rgb),.04) 0 1px,transparent 1px 78px);animation:pulse 9s ease-in-out infinite}
  .glow{z-index:-1;background:radial-gradient(circle at 20% 10%,rgba(var(--rgb),.16),transparent 45%),radial-gradient(circle at 85% 75%,rgba(var(--rgb),.10),transparent 50%);animation:breathe 16s ease-in-out infinite alternate}
  @keyframes drift{from{background-position:0 0}to{background-position:420px 840px}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes breathe{from{transform:scale(1)}to{transform:scale(1.15) translateY(-2%)}}
  @keyframes shine{0%,100%{text-shadow:0 0 18px rgba(var(--rgb),.35)}50%{text-shadow:0 0 34px rgba(var(--rgb),.75)}}
  @keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(var(--rgb),.45)}50%{box-shadow:0 0 0 12px rgba(var(--rgb),0)}}
  .topbar{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;justify-content:space-between;padding:14px 5vw;border-bottom:1px solid rgba(var(--rgb),.35);background:rgba(10,10,10,.85)}
  .brand{font-weight:800;letter-spacing:.06em;color:var(--bright);text-decoration:none;font-size:1.1rem}
  .topbar ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 20px;margin:0;padding:0}
  .topbar li a{color:#e8e8e8;text-decoration:none;font-size:1.05rem;padding:6px 0;display:inline-block}
  .topbar li a:hover{color:var(--bright);text-decoration:underline}
  main{max-width:1120px;margin:0 auto;padding:0 5vw 40px}
  header.hero{max-width:1120px;margin:0 auto;padding:72px 5vw 36px;text-align:center}
  .kicker{text-transform:uppercase;letter-spacing:.22em;color:var(--bright);font-size:1rem;font-weight:700;margin:0 0 12px}
  h1{font-size:clamp(2.5rem,6.5vw,4.4rem);line-height:1.12;margin:0 0 18px;color:#ffffff;animation:shine 6s ease-in-out infinite;overflow-wrap:anywhere}
  .sub{font-size:clamp(1.3rem,2.6vw,1.65rem);color:#f2f2f2;margin:0 auto 14px;max-width:820px}
  .emblem{position:relative;width:min(320px,80vw);margin:0 auto 28px}
  .emblem video{display:block;width:100%;height:auto;border-radius:50%;border:2px solid rgba(var(--rgb),.6);box-shadow:0 0 42px rgba(var(--rgb),.35);background:#000;cursor:pointer}
  .play-btn{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:2px solid var(--accent);background:rgba(10,10,10,.72);color:var(--bright);font-size:2rem;line-height:1;cursor:pointer;display:none}
  .play-btn.show{display:block}
  .btn{display:inline-block;min-height:52px;padding:14px 30px;border-radius:12px;background:var(--accent);color:#0a0a0a;font-weight:800;font-size:1.25rem;text-decoration:none;animation:beat 2.8s ease-out infinite}
  .btn:hover{background:var(--bright);color:#000000}
  .back{margin-top:34px}
  footer{max-width:1120px;margin:0 auto;padding:0 5vw 40px;text-align:center;color:#d8d8d8;font-size:1.05rem}

<main id="main">

      <video id="emblemVideo" autoplay loop muted playsinline preload="auto" poster="ring-of-6-poster.jpg" src="ring-of-6.mp4" aria-label="Ring of 6 emblem" title="Ring of 6 emblem"></video>
      <button id="playBtn" class="play-btn" type="button" aria-label="Play the Ring of 6 emblem">&#9654;</button>

<script>
(function () {
  var video = document.getElementById('emblemVideo');
  var btn = document.getElementById('playBtn');
  function showPlay() { btn.classList.add('show'); }
  function hidePlay() { btn.classList.remove('show'); }
  function tryPlay() {
    var p = video.play();
    if (p && p.catch) { p.catch(showPlay); }
  }
  video.addEventListener('pause', showPlay);
  video.addEventListener('playing', hidePlay);
  btn.addEventListener('click', function () { video.play(); });
  video.addEventListener('click', function () {
    if (video.paused) { video.play(); } else { video.pause(); }
  });
  tryPlay();
  setTimeout(function () { if (video.paused) { showPlay(); } }, 1200);
})();
</script>
